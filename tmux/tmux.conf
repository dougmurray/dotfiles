# Remove the old prefix
# unbind C-b

# Set the prefix to Something other than CTRL B
# set-option -g prefix C-a
# bind-key C-a send-prefix
# Set new prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Send new prefix to applications by pressing it twice
bind C-a send-prefix

# Use vim keybindings for copy/paste
setw -g mode-keys vi

# Use the already configurated vim colorscheme
set -g default-terminal "xterm-256color"

# Use Vim keybindings instead of arrows for switching panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reduce escape time for tmux
# Makes Neovim/Vim snappier with tmux
set-option -sg escape-time 10

# Increase scrollback in panes
set-option -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Experimental, status bar config
# Position at top
set -g status-position top

# Overall status bar background/foreground (this is the "bar" itself)
set -g status-style bg=colour238,fg=colour250

# Minimal content
set -g status-left ""
set -g status-right "%H:%M "
set -g status-justify left

# Window list styling (this is what your window-status-style was targeting)
set -g window-status-style bg=colour238,fg=colour250
set -g window-status-current-style bg=colour238,fg=colour255,bold

# Optional: kill the border lines/format clutter
set -g status-left-length 0
